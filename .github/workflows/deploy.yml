name: Validate SCA-QR

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run setup:local
      - run: npm run test:integration
      - run: npm run backup -- var/ci-verification.sca
      - run: npm run restore:verify -- var/ci-verification.sca
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:institution
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
# No automatic deployment or paid infrastructure. Hosting is chosen after phase-0 capacity review.
